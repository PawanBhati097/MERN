<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        background-color: black;
    }
    .box{
        width:200px;
        height :200px;
        background-color: red;

        /* animation */
        animation: moveBox 2S ease-in-out infinite ;
        position: relative;
    }

    @keyframes moveBox{
        0%{
            top:0px;
            left:0px;
            transform: rotate(0deg);
            background-color: red;
        }
        25%{
            top:300px;
            left:0px;
            transform: rotate(90deg);
            background-color: yellow;
        }
        50%{
            top:300px;
            left:300px;
            transform: rotate(180deg);
            background-color: green;
        }
        75%{
            top:0px;
            left:300px;
        transform: rotate(270deg);
         background-color: blue;}
        100%{
            top:0px;
            left:0px;
        transform: rotate(360deg);
         background-color: red;}
    }

    .container{
        display: flex;
        justify-content: center;
    }
    .b{
        width: 200px;
        height: 350px;
    
    }

    .b1{
        background-color: green;
    }
    .b2{
        background-color: yellow;
    }
    .b3{
        background-color: blue;
    }
    .b4{
        background-color: aquamarine;
    }
    @media (min-width:1000px) {
        .container{
            gap: 150px;
        }
    }
    @media (min-width:960px) and (max-width:1000px) {
         .container{
            gap: 100px;
        }
    }
    @media (min-width:540px) and (max-width:959px) {
         .container{
            gap: 60px;
        }
    }
    @media (min-width:500px) and (max-width:600px) {
         .container{
            gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .b{

        width: 50%;
        }
    }
    @media  (max-width:400px) {
          .container{
            gap: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .b{

        width: 90%;
        }
    }
</style>
<body>
    <div class="box"></div>

    <div class="container">
        <div class="b b1"></div>
        <div class="b b2"></div>
        <div class="b b3"></div>
        <div class="b b4"></div>
    </div>

</body>
</html>
