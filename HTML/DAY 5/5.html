<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>Novell Services Login</h3>
    <form action="">
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Password</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>City of <br>Employement</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Webserver</td>
                <td>
                    <select name="" id="">
                        <option value="">Choose a server</option>
                        <option value="">Apache</option>
                        <option value="">GCP</option>
                        <option value="">AWS</option>
                    </select>
                </td>
            </tr>
            <TR>
                <td rowspan="4">Please specify your role</td>
                <td>
                    <input type="radio" name="role">Admin
                </td>
                <tr>
                    <td>
                         <input type="radio" name="role">Engineer
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" name="role">Manager
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="radio" name="role">Guest
                    </td>
                </tr>
            </TR>
            <tr>
                <td rowspan="4">Single Sign-on <br>to the following</td>
                <td>
                    <input type="checkbox">Mail
                </td>
                <tr>
                    <td>
                        <input type="checkbox">Payroll
                    </td>
                </tr>
                <tr>
                    <td>
                        <input type="checkbox">Self-service
                    </td>
                </tr>
            </tr>
            <tr>
                <td><input type="Submit" value="login">
                <input type="Reset" ></td>
            </tr>
        </table>
    </form>
</body>
</html>
